<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header></header>

    <main> <!--& LISTS -->
        <ul>
            <li>Home</li> <!-- unordered list -->
            <ul>
                <li>home : delhi</li>
            </ul>
            <li>About</li>
            <ul>
                <li>about : india

                </li>
            </ul>
            <li>Contact</li>
            <ul>
                <li>contact : 1234567890</li> 

        </ul>

        <br>

    <ol>
         <li>apple</li> <!-- ordered list -->
         <ul>
            <li>color : red</li>
        </ul>
        <li>mango</li>
        <ul>
            <li>color : yellow</li>
        </ul>
        <li>strawberry</li>
        <ul>
            <li>color : red</li>
        </ul>
    </ol>

    <br>

    <!--& TABLES -->
    <table> <!-- table -->
        <thead><!-- table head --> 
            <tr> 
                <th colspan="2">Student information</th> <!-- colspan attribute -->
               
            </tr>
        </thead>
        <caption>Students Report</caption> <!-- caption -->
        <tr>
            <th>Name</th>
            <th>Roll No</th>
        </tr>
        <tr>
            <td>tanmay</td>
            <td>1</td>
        </tr>
        <tr>
        <tbody><!-- table body -->
    </table>

    <!--& FORMS -->

    <form action="https://www.google.com/search" method="get"> <!-- form -->

        <label for="search">Search:</label> <!-- label is used to describe the purpose of the input field -->
        <input type="text" id="search" name="q"> <!-- input field is used to create a text input -->
        <input type="submit" value="Search"> <!-- submit button is used to submit the form -->

        <input type="password" placeholder="Enter your password"> <!-- password field is used to create a password input -->

        <input type="checkbox" id="subscribe" name="subscribe" value="yes"> <!-- checkbox is used to create a checkbox input -->
        <label for="subscribe">Subscribe to newsletter</label> <!-- label is used to describe the purpose of the checkbox -->

        <input type="radio" id="option1" name="options" value="option1"> <!-- radio button is used to create a radio button input -->
        <label for="option1">Option 1</label> <!-- label is used to describe the purpose of the radio button -->
        <input type="radio" id="option2" name="options" value="option2"> <!-- radio button is used to create a radio button input -->
        <label for="option2">Option 2</label> <!-- label is used to describe the purpose of the radio button -->

        <input type="button" value="Click me" onclick="alert('Button clicked!')"> <!-- button is used to create a button input -->
    </form>
     
    <!--& iframe -->
    <iframe src="https://www.wikipedia.org" width="600" height="400"></iframe> <!-- iframe is used to embed another HTML document within the current document -->


    </main>
</body>
</html>
