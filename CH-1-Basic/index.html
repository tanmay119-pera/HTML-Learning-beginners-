<!-- HTML, which stands for "HyperText Markup Language," is the foundational language of the web. It's used to create and structure websites. By utilizing HTML tags, 
we can define the appearance and layout of a website. With a good grasp of these tags and their proper usage, creating beautiful
websites becomes straightforward and efficient!

THEN WHY CSS & JAVASCRIPT 

HTML is used to define the layout of a page, providing a barebone structure for the content. CSS is used to add 
styling to that barebone page created using HTML. JavaScript is used to program logic for the page layout e.g.
What happens when a user hovers on a text, when to hide or show elements etc.

We start building a website by creating a file named index.html. index.html is a special filename which is presented 
when the website root address is typed-->

<!-- # FIRST WEBSITE/ FIRST HTML CODE   -->

<!Doctype html> <!-- Specifies this is an html 5 document --> 
<html> <!-- Root of an HTML page--> 
    <head> <!-- Contains page metadata. --> 
        <title>tanmay's Website</title> <!-- Contains title --> 
    </head> <body> <!-- The main body of the page (rendered by the browser) --> 
        <h1> <!-- This is a heading <h1> - heading tag --> 
            <p> My paragraph. </p> <!-- Paragraph tag --> 
        </body> <!-- Closing body tag. --> 
        </html> 

<!-- The above code is a simple HTML document that includes the basic structure of an HTML page. It starts with the doctype 
declaration, followed by the html tag, head section with a title, and the body section containing a heading and a paragraph.

#                                     text editor ======> browser ========> output.                                      

<head> & <body> tags are children of HTML tag.
• HTML is the parent of <head> & <body> tags.
• Most of the HTML elements have opening & closing tag with content in between
opening & closing tags.
• Some HTML tags have no content. These are called Empty elements e.g. <br>
• We can either use .htm or .html extension.
• you can use “inspect element” or “view page source” option from Chrome to
look into a website’s HTML Code. -->

<!-- BOLIERPLATE 
USE "!" FOR USING BOLIERPLATE IN HTML -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    THIS IS MY FIRST WEBSITE!
</body>
</html>

<!-- The above code is a boilerplate HTML document that includes the basic structure of an HTML page. It starts with the doctype
declaration, followed by the html tag with a language attribute, head section with meta tags for character encoding and 
viewport settings, and a title. The body section contains a simple text message. -->
